name: Validate and build distributions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install 'pyyaml>=6,<7' 'jsonschema>=4,<5' 'pytest>=8,<9'
      - name: Run project regression tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and validate all five distributions with canonical engine scripts
        run: python -B scripts/build_distributions.py --project-root . --version 0.0.0-ci
      - name: Check generated OpenCode documentation
        run: python -B -m unittest discover -s tests -p 'test_runtime_docs.py' -v
      - name: Verify generated Chat ZIP excludes offline engine
        run: python -B -m unittest discover -s tests -p 'test_chat_bundle.py' -v
      - name: Verify generated Plugin Skill version metadata
        run: python -B -m unittest discover -s tests -p 'test_plugin_version_metadata.py' -v
      - name: Validate distributions
        run: python -B scripts/validate_distributions.py --project-root .
      - name: Release-readiness report
        run: python -B scripts/assess_release_readiness.py --project-root . --include-build-state
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: distributions-ci
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
